    <h2>Working Demonstration</h2>
    <div class='form-grid'><input id='a' type='number' value='12'><input id='b' type='number' value='4'></div><button onclick='calc()'>Calculate</button><div id='out' class='output'></div>

<script>
function calc(){const a=+document.getElementById('a').value,b=+document.getElementById('b').value;document.getElementById('out').textContent=`Sum=${a+b}, Difference=${a-b}, Product=${a*b}, Quotient=${b?a/b:'undefined'}`;}
</script>
