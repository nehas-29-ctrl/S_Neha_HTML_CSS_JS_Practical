  <p class="lead">JavaScript practical demonstration.</p>
  
  <div class="panel">
    <h2>Working Demonstration</h2>
    <div id='sw' class='output' style='font-size:2rem'>00:00.0</div><button onclick='start()'>Start</button><button onclick='stop()'>Stop</button><button onclick='reset()'>Reset</button>
  </div>
</div>

<script>
let st=0,timer;function render(){const x=(Date.now()-st)/1000;document.getElementById('sw').textContent=x.toFixed(1)+'s';}function start(){if(!timer){st=Date.now();timer=setInterval(render,100)}}function stop(){clearInterval(timer);timer=null}function reset(){stop();document.getElementById('sw').textContent='00:00.0'}
</script>
</body>
