  <h1>Create a countdown timer using JavaScript.</h1>
  <p class="lead">JavaScript practical demonstration.</p>
  
  <div class="panel">
    <h2>Working Demonstration</h2>
    <input id='mins' type='number' value='1' min='0'><button onclick='start()'>Start Countdown</button><div id='out' class='output'>Ready</div>
  </div>
</div>

</main>

  <div class="container">

<script>
let timer;function start(){clearInterval(timer);let s=+document.getElementById('mins').value*60;timer=setInterval(()=>{document.getElementById('out').textContent=s+' seconds';if(s<=0)clearInterval(timer);s--;},1000);}
</script>
