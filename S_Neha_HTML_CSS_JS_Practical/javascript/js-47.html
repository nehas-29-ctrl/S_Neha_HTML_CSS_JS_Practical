<section class="section">
<div class="container">
  <p class="kicker">Experiment 47</p>
  <h1>Write a program to find the greatest common divisor (GCD) of two numbers.</h1>
  <p class="lead">JavaScript practical demonstration.</p>
  
  <div class="panel">
    <h2>Working Demonstration</h2>
    <input id='a' type='number' value='24'><input id='b' type='number' value='18'><button onclick='run()'>GCD</button><div id='out' class='output'></div>
  </div>
</div>
</section>

</main>
<footer>
  <div class="container">
    <strong>S. Neha</strong> • PRN 250200386 • Section 5<br>

  </div>

<script>
function run(){let a=Math.abs(+document.getElementById('a').value),b=Math.abs(+document.getElementById('b').value);while(b)[a,b]=[b,a%b];document.getElementById('out').textContent=a;}
</script>
</body>
