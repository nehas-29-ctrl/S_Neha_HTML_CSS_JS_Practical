  <h1>Create a to-do list application.</h1>
  <p class="lead">To-do list.</p>
  
  <div class="panel">
    <h2>Working Demonstration</h2>
    <input id='task'><button onclick='add()'>Add</button><ul id='list'></ul>
  </div>
</div>

<footer>
  <div class="container">

<script>
function add(){if(!task.value)return;const li=document.createElement('li');li.textContent=task.value;li.onclick=()=>li.remove();list.append(li);task.value=''}
</script>
</body>
