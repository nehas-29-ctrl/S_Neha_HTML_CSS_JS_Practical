<main>

<section class="section">
<div class="container">
  <p class="kicker">Experiment 10</p>
  <h1>Create a simple expense tracker.</h1>
  <p class="lead">Expense tracker.</p>
  
  <div class="panel">
    <h2>Working Demonstration</h2>
    <input id='desc' placeholder='Expense'><input id='amt' type='number' placeholder='Amount'><button onclick='add()'>Add</button><ul id='list'></ul><div id='out' class='output'>Total: 0</div>
  </div>
</div>
</section>

</main>
<footer>
  <div class="container">
    <strong>S. Neha</strong> • PRN 250200386 • Section 5<br>
    HTML, CSS & JavaScript Practical Programs
  </div>
</footer>
<script>
let total=0;function add(){const a=+amt.value;if(!desc.value||!a)return;total+=a;const li=document.createElement('li');li.textContent=`${desc.value}: ₹${a}`;list.append(li);out.textContent='Total: ₹'+total;desc.value='';amt.value=''}
</script>
</body>
</html>
