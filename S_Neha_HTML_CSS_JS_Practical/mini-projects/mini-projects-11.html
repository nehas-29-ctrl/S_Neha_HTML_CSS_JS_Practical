<section class="section">
<div class="container">
  <p class="kicker">Experiment 11</p>
  <h1>Create a student marks/grade calculator.</h1>
  <p class="lead">Marks / grade calculator.</p>
  
  <div class="panel">
    <h2>Working Demonstration</h2>
    <input id='marks' value='80,72,91'><button onclick='run()'>Calculate</button><div id='out' class='output'></div>
  </div>
</div>

</main>
<footer>
  <div class="container">

<script>
function run(){const a=marks.value.split(',').map(Number),avg=a.reduce((x,y)=>x+y,0)/a.length;out.textContent=`Total=${a.reduce((x,y)=>x+y,0)}, Average=${avg.toFixed(2)}, Grade=${avg>=90?'A':avg>=75?'B':avg>=60?'C':'D'}`}
</script>
</body>
