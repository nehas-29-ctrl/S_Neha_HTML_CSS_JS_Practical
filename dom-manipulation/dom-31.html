<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Create a live word counter. | S. Neha</title><link rel="stylesheet" href="../assets/style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="../index.html">S. Neha • Practical Programs</a><nav class="nav-links"><a href="../index.html">Home</a><a href="index.html">Back to DOM Manipulation</a></nav></div></header><main><section class="section"><div class="container"><p class="kicker">DOM Manipulation • Experiment 31</p><h1>Create a live word counter.</h1><p class="lead">Working DOM demonstration for the experiment listed in the assignment.</p><div class="panel"><button onclick="runDemo()">Run Demonstration</button><div id="out" class="output">Ready.</div></div></div></section></main><footer><div class="container"><strong>S. Neha</strong> • PRN 250200386 • Section 5</div></footer><script>function runDemo(){const t=document.createElement('textarea');t.oninput=()=>c.textContent=(t.value.trim().match(/\S+/g)||[]).length+' words';const c=document.createElement('span');document.getElementById('out').replaceChildren(t,c);}</script></body></html>
