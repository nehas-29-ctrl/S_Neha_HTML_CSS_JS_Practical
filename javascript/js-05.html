<section class="section">
<div class="container">
  <p class="kicker">Experiment 5</p>
  <h1>Write a program to check whether a number is positive, negative, or zero.</h1>
  <p class="lead">JavaScript practical demonstration.</p>
  
  <div class="panel">
    <h2>Working Demonstration</h2>
    <input id='n' type='number' value='-4'><button onclick='run()'>Check</button><div id='out' class='output'></div>
  </div>
</div>
</section>

</main>
<footer>
  <div class="container">
    <strong>S. Neha</strong> • PRN 250200386 • Section 5<br>
    HTML, CSS & JavaScript Practical Programs
  </div>
</footer>
<script>
function run(){const n=+document.getElementById('n').value;document.getElementById('out').textContent=n>0?'Positive':n<0?'Negative':'Zero';}
</script>
</body>
