<main>

<section class="section">
<div class="container">
  <p class="kicker">Experiment 28</p>
  <h1>Create a number guessing game.</h1>
  <p class="lead">JavaScript practical demonstration.</p>
  
  <div class="panel">
    <h2>Working Demonstration</h2>
    <div class='form-grid'><input id='a' type='number' value='20'><input id='op' value='*'><input id='b' type='number' value='5'></div><button onclick='run()'>Calculate</button><div id='out' class='output'></div>
  </div>
</div>
</section>

</main>
<footer>
  <div class="container">
    <strong>S. Neha</strong> • PRN 250200386 • Section 5<br>
    HTML, CSS & JavaScript Practical Programs
  </div>
</footer>
<script>
function run(){const a=+document.getElementById('a').value,b=+document.getElementById('b').value,op=document.getElementById('op').value;const r=op==='+'?a+b:op==='-'?a-b:op==='/'?a/b:a*b;document.getElementById('out').textContent=r;}
</script>
</body>
</html>
