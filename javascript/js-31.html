<section class="section">
<div class="container">
  <p class="kicker">Experiment 31</p>
  <h1>Create a to-do list using JavaScript.</h1>
  <p class="lead">JavaScript practical demonstration.</p>
  
  <div class="panel">
    <h2>Working Demonstration</h2>
    <input id='task' placeholder='New task'><button onclick='add()'>Add</button><ul id='list'></ul>
  </div>
</div>
</section>

</main>
<footer>
  <div class="container">
    <strong>S. Neha</strong> • PRN 250200386 • Section 5<br>
    HTML, CSS & JavaScript Practical Programs
  </div>
</footer>
<script>
function add(){const v=document.getElementById('task').value.trim();if(!v)return;const li=document.createElement('li');li.textContent=v;li.onclick=()=>li.remove();document.getElementById('list').append(li);document.getElementById('task').value='';}
</script>
</body>
