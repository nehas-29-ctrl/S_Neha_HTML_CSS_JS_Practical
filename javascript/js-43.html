  <h1>Store and retrieve data using localStorage.</h1>
  <p class="lead">JavaScript practical demonstration.</p>
  
  <div class="panel">
    <h2>Working Demonstration</h2>
    <input id='v' placeholder='Enter a value'><button onclick='save()'>Save</button><button onclick='load()'>Load</button><div id='out' class='output'></div>
  </div>
</div>

</main>

  <div class="container">

<script>
function save(){localStorage.setItem('hariValue',document.getElementById('v').value);document.getElementById('out').textContent='Saved.'}function load(){document.getElementById('out').textContent=localStorage.getItem('hariValue')||'No saved value.'}
</script>
</body>
