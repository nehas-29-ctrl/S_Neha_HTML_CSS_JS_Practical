  <h1>Write a JavaScript program to swap two numbers.</h1>
  <p class="lead">JavaScript practical demonstration.</p>
  
  <div class="panel">
    <h2>Working Demonstration</h2>
    <input id='a' type='number' value='10'><input id='b' type='number' value='20'><button onclick='run()'>Swap</button><div id='out' class='output'></div>
  </div>
</div>
</section>

</main>
<footer>
  <div class="container">

<script>
function run(){let a=+document.getElementById('a').value,b=+document.getElementById('b').value;[a,b]=[b,a];document.getElementById('out').textContent=`a=${a}, b=${b}`;}
</script>
