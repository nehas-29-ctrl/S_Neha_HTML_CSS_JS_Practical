<section class="section">
<div class="container">
  <p class="kicker">Experiment 1</p>
  <h1>Create a digital calculator.</h1>
  <p class="lead">Digital calculator.</p>
  
  <div class="panel">
    <h2>Working Demonstration</h2>
    <input id='a' type='number' value='12'><select id='op'><option>+</option><option>-</option><option>*</option><option>/</option></select><input id='b' type='number' value='3'><button onclick='run()'>=</button><div id='out' class='output'></div>
  </div>
</div>
</section>

</main>
<footer>
  <div class="container">
    <strong>S. Neha</strong> • PRN 250200386 • Section 5<br>
    HTML, CSS & JavaScript Practical Programs
  </div>
</footer>
<script>
function run(){const a=+document.getElementById('a').value,b=+document.getElementById('b').value,o=op.value;out.textContent=o==='+'?a+b:o==='-'?a-b:o==='*'?a*b:a/b}
</script>
</body>
