<script>
let turn='X';for(let i=0;i<9;i++){const b=document.createElement('button');b.style.height='80px';b.onclick=()=>{if(!b.textContent){b.textContent=turn;turn=turn==='X'?'O':'X'}};board.append(b)}
</script>
