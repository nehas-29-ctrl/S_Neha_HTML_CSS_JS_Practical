  <h1>Create a notes application using localStorage.</h1>
  <p class="lead">Notes with localStorage.</p>
  
  <div class="panel">
    <h2>Working Demonstration</h2>
    <textarea id='note' placeholder='Write a note'></textarea><button onclick="localStorage.setItem('hariNote',note.value);out.textContent='Saved'">Save</button><button onclick="note.value=localStorage.getItem('hariNote')||''">Load</button><div id='out' class='output'></div>
  </div>
</div>
