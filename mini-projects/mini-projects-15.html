    <input id='w' type='number' placeholder='Weight kg' value='60'><input id='h' type='number' placeholder='Height m' value='1.7'><button onclick='run()'>Calculate</button><div id='out' class='output'></div>

<script>
function run(){const bmi=+w.value/(+h.value**2);out.textContent='BMI: '+bmi.toFixed(2)}
</script>
