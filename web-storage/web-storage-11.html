    <h2>Working Demonstration</h2>
    <input id='v' value='S. Neha'><button onclick="localStorage.setItem('hari',v.value);out.textContent='Saved'">Save</button><button onclick="out.textContent=localStorage.getItem('hari')||'Nothing saved'">Load</button><button onclick="localStorage.removeItem('hari');out.textContent='Deleted'">Delete</button><div id='out' class='output'></div>
